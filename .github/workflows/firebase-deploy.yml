name: Firebase Deploy

on:
  push:
    branches:
      - main  # Change this if you want to deploy from a different branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.20.5'  # Use your Node.js version

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build React app
      - name: Build React app
        run: npm run build

      # Install Firebase CLI globally
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Authenticate Firebase using GitHub Secret
      - name: Authenticate to Firebase
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" > firebaseServiceAccountKey.json

      # Deploy to Firebase
      - name: Deploy to Firebase
        run: |
          firebase use --add ${{ secrets.FIREBASE_PROJECT_ID }}
          firebase deploy --only hosting,functions --token "$(cat firebaseServiceAccountKey.json)"
